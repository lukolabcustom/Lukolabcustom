<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Il Lab — Luko Lab Custom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .back {
      display: inline-block;
      margin-bottom: 50px;
      color: #fff;
      text-decoration: none;
      font-size: 18px;
    }

    h1 {
      font-size: 56px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 28px;
      margin-bottom: 55px;
    }

    .card {
      background: #1d1d1d;
      border-radius: 32px;
      padding: 38px;
      margin-bottom: 35px;
    }

    h2 {
      font-size: 42px;
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 20px;
      font-weight: bold;
      margin: 25px 0 10px;
    }

    input,
    select {
      width: 100%;
      padding: 20px;
      border-radius: 18px;
      border: 2px solid #555;
      background: #111;
      color: #fff;
      font-size: 19px;
    }

    input[type="file"] {
      padding: 15px;
    }

    button {
      width: 100%;
      padding: 22px;
      border: 0;
      border-radius: 20px;
      background: #fff;
      color: #111;
      font-size: 20px;
      font-weight: bold;
      margin-top: 30px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .login-card {
      max-width: 600px;
      margin: 80px auto;
    }

    .product {
      border-top: 1px solid #444;
      padding: 30px 0;
    }

    .product:first-child {
      border-top: 0;
    }

    .product img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 18px;
      margin-bottom: 18px;
    }

    .product-name {
      font-size: 25px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-info {
      color: #aaa;
      font-size: 17px;
      margin-bottom: 15px;
    }

    .delete-button {
      background: #d93636;
      color: #fff;
      margin-top: 15px;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 14px;
      background: #292929;
      display: none;
    }

    .preview {
      width: 100%;
      border-radius: 18px;
      margin-top: 15px;
      display: none;
      max-height: 400px;
      object-fit: cover;
    }

    @media(max-width:600px) {
      .page {
        padding: 25px 18px 60px;
      }

      h1 {
        font-size: 42px;
      }

      .subtitle {
        font-size: 23px;
      }

      .card {
        padding: 28px 22px;
        border-radius: 26px;
      }

      h2 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

<div class="page">

  <a class="back" href="/">
    ← Torna allo shop
  </a>

  <div id="loginSection">

    <h1>IL LAB</h1>

    <div class="subtitle">
      Area privata Luko Lab Custom
    </div>

    <div class="card login-card">

      <h2>Accesso</h2>

      <label>Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Inserisci password"
      >

      <button
        type="button"
        id="loginButton"
      >
        ENTRA NEL LAB
      </button>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </div>


  <div
    id="labSection"
    style="display:none;"
  >

    <h1>IL LAB</h1>

    <div class="subtitle">
      Gestisci i tuoi prodotti
    </div>


    <div class="card">

      <h2>Aggiungi prodotto</h2>

      <label>Nome prodotto</label>

      <input
        id="name"
        type="text"
        placeholder="Es. Cappello Jungle"
      >

      <label>Prezzo €</label>

      <input
        id="price"
        type="number"
        value="35"
        min="1"
        step="0.01"
      >

      <label>Categoria</label>

      <select id="category">
        <option value="Cappelli">Cappelli</option>
        <option value="Abbigliamento">Abbigliamento</option>
      </select>

      <label>Foto</label>

      <input
        id="photo"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/heic"
      >

      <img
        id="preview"
        class="preview"
        alt="Anteprima"
      >

      <button
        type="button"
        id="publishButton"
      >
        PUBBLICA PRODOTTO
      </button>

      <div
        id="publishMessage"
        class="message"
      ></div>

    </div>


    <div class="card">

      <h2>Prodotti</h2>

      <div id="products">
        Caricamento prodotti...
      </div>

    </div>

  </div>

</div>


<script>

  const loginButton =
    document.getElementById("loginButton");

  const passwordInput =
    document.getElementById("password");

  const loginMessage =
    document.getElementById("loginMessage");


  // LOGIN

  loginButton.addEventListener(
    "click",
    login
  );


  passwordInput.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {
        login();
      }

    }
  );


  async function login() {

    const password =
      passwordInput.value.trim();


    loginMessage.style.display =
      "none";


    if (!password) {

      loginMessage.textContent =
        "Inserisci la password.";

      loginMessage.style.display =
        "block";

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "ACCESSO...";


    try {

      const response =
        await fetch(
          "/api/admin-login",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              password: password
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Password non corretta."
        );
      }


      document.getElementById(
        "loginSection"
      ).style.display = "none";


      document.getElementById(
        "labSection"
      ).style.display = "block";


      loadProducts();


    } catch (error) {

      loginMessage.textContent =
        error.message ||
        "Errore di connessione.";

      loginMessage.style.display =
        "block";

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "ENTRA NEL LAB";
    }

  }


  // ANTEPRIMA FOTO

  document
    .getElementById("photo")
    .addEventListener(
      "change",
      function() {

        const file =
          this.files[0];

        const preview =
          document.getElementById(
            "preview"
          );


        if (!file) {

          preview.style.display =
            "none";

          return;
        }


        preview.src =
          URL.createObjectURL(file);

        preview.style.display =
          "block";

      }
    );


  // PUBBLICA PRODOTTO

  document
    .getElementById("publishButton")
    .addEventListener(
      "click",
      publishProduct
    );


  async function publishProduct() {

    const button =
      document.getElementById(
        "publishButton"
      );

    const message =
      document.getElementById(
        "publishMessage"
      );


    const name =
      document.getElementById(
        "name"
      ).value.trim();


    const price =
      document.getElementById(
        "price"
      ).value;


    const category =
      document.getElementById(
        "category"
      ).value;


    const file =
      document.getElementById(
        "photo"
      ).files[0];


    if (!name) {

      message.textContent =
        "Inserisci il nome del prodotto.";

      message.style.display =
        "block";

      return;
    }


    if (!file) {

      message.textContent =
        "Seleziona una foto.";

      message.style.display =
        "block";

      return;
    }


    button.disabled = true;

    button.textContent =
      "CARICAMENTO...";


    try {

      // Carica la libreria SOLO quando serve
      const module =
        await import(
          "https://cdn.jsdelivr.net/npm/@vercel/blob@2.4.0/+esm"
        );


      const blob =
        await module.upload(
          file.name,
          file,
          {
            access: "public",
            handleUploadUrl:
              "/api/upload"
          }
        );


      const response =
        await fetch(
          "/api/products",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              name: name,

              price: price,

              category: category,

              image: blob.url

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error ||
          "Impossibile pubblicare il prodotto."
        );
      }


      message.textContent =
        "Prodotto pubblicato con successo.";

      message.style.display =
        "block";


      document.getElementById(
        "name"
      ).value = "";


      document.getElementById(
        "price"
      ).value = "35";


      document.getElementById(
        "photo"
      ).value = "";


      document.getElementById(
        "preview"
      ).style.display = "none";


      loadProducts();


    } catch (error) {

      message.textContent =
        error.message ||
        "Errore durante il caricamento.";

      message.style.display =
        "block";

    } finally {

      button.disabled = false;

      button.textContent =
        "PUBBLICA PRODOTTO";
    }

  }


  // CARICA PRODOTTI

  async function loadProducts() {

    const container =
      document.getElementById(
        "products"
      );


    container.innerHTML =
      "Caricamento prodotti...";


    try {

      const response =
        await fetch(
          "/api/products?refresh=" +
          Date.now()
        );


      const data =
        await response.json();


      const products =
        Array.isArray(data.products)
          ? data.products
          : [];


      if (products.length === 0) {

        container.innerHTML =
          "<p>Nessun prodotto.</p>";

        return;
      }


      container.innerHTML =
        products
          .map(function(product) {

            const image =
              product.image
                ? `
                  <img
                    src="${escapeHtml(product.image)}"
                    alt=""
                  >
                `
                : "";


            return `

              <div class="product">

                ${image}

                <div class="product-name">
                  ${escapeHtml(product.name)}
                </div>

                <div class="product-info">
                  € ${Number(product.price).toFixed(2)}
                  ·
                  ${escapeHtml(product.category)}
                </div>

                <button
                  type="button"
                  class="delete-button"
                  data-id="${escapeHtml(product.id)}"
                >
                  ELIMINA PRODOTTO
                </button>

              </div>

            `;

          })
          .join("");


      // Collega i pulsanti elimina

      container
        .querySelectorAll(
          ".delete-button"
        )
        .forEach(function(button) {

          button.addEventListener(
            "click",
            function() {

              deleteProduct(
                button.dataset.id
              );

            }
          );

        });


    } catch (error) {

      container.innerHTML =
        "<p>Impossibile caricare i prodotti.</p>";

    }

  }


  // ELIMINA PRODOTTO

  async function deleteProduct(id) {

    const conferma =
      confirm(
        "Vuoi davvero eliminare questo prodotto?"
      );


    if (!conferma) {
      return;
    }


    try {

      const response =
        await fetch(
          "/api/products",
          {
            method: "DELETE",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              id: id
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        alert(
          data.error ||
          "Impossibile eliminare il prodotto."
        );

        return;
      }


      alert(
        "Prodotto eliminato."
      );


      loadProducts();


    } catch (error) {

      alert(
        "Errore durante l'eliminazione."
      );

    }

  }


  // SICUREZZA TESTO

  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }

</script>

</body>
</html>
