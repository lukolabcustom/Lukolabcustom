<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Admin — Luko Lab Custom
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b12;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #b9c9bf;
      margin-bottom: 25px;
    }

    .box {
      background: #10271b;
      border: 1px solid #244833;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      margin-bottom: 15px;
      border-radius: 10px;
      border: 1px solid #41624b;
      background: #071b12;
      color: white;
      font-size: 16px;
    }

    input[type="file"] {
      padding: 10px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 10px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .primary {
      background: #d7ff52;
      color: #102000;
      width: 100%;
    }

    .delete {
      background: #c93636;
      color: white;
      margin-top: 10px;
      width: 100%;
    }

    .logout {
      background: #304b39;
      color: white;
      margin-top: 10px;
    }

    .product {
      border: 1px solid #31563d;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      background: #0b2115;
    }

    .product img {
      width: 100%;
      max-width: 220px;
      display: block;
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .product-name {
      font-size: 18px;
      font-weight: bold;
    }

    .product-info {
      color: #b9c9bf;
      margin-top: 5px;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      background: #164b2b;
      color: #baffc9;
    }

    .error {
      background: #571f1f;
      color: #ffc1c1;
    }

    #adminArea {
      display: none;
    }

    #loginArea {
      max-width: 500px;
      margin: 80px auto;
    }

  </style>
</head>

<body>

<div
  id="loginArea"
  class="box"
>

  <h1>
    🔐 Luko Lab Custom
  </h1>

  <div class="subtitle">
    Accesso area amministratore
  </div>

  <label>
    Password
  </label>

  <input
    type="password"
    id="loginPassword"
    placeholder="Inserisci password"
  >

  <button
    class="primary"
    onclick="login()"
  >
    Accedi
  </button>

  <div
    id="loginMessage"
    class="message error"
  ></div>

</div>


<div
  id="adminArea"
  class="container"
>

  <h1>
    🌴 Gestione prodotti
  </h1>

  <div class="subtitle">
    Aggiungi o elimina i prodotti del tuo negozio.
  </div>


  <div class="box">

    <h2>
      ➕ Aggiungi prodotto
    </h2>

    <label>
      Nome prodotto
    </label>

    <input
      type="text"
      id="productName"
      placeholder="Es. Cappello Tropical"
    >


    <label>
      Prezzo (€)
    </label>

    <input
      type="number"
      id="productPrice"
      value="35"
      min="0.01"
      step="0.01"
    >


    <label>
      Categoria
    </label>

    <select id="productCategory">

      <option value="Cappelli">
        Cappelli
      </option>

      <option value="Abbigliamento">
        Abbigliamento
      </option>

    </select>


    <label>
      Foto prodotto
    </label>

    <input
      type="file"
      id="productImage"
      accept="image/jpeg,image/png,image/webp"
    >


    <button
      class="primary"
      id="publishButton"
      onclick="addProduct()"
    >
      Pubblica prodotto
    </button>


    <div
      id="addMessage"
      class="message"
    ></div>

  </div>


  <div class="box">

    <h2>
      📦 Prodotti presenti
    </h2>

    <div id="productsList">
      Caricamento...
    </div>

  </div>


  <button
    class="logout"
    onclick="logout()"
  >
    Esci
  </button>

</div>


<script>

/* =========================
   LOGIN
========================= */

async function login() {

  const password =
    document
      .getElementById(
        "loginPassword"
      )
      .value;

  const message =
    document
      .getElementById(
        "loginMessage"
      );

  message.style.display =
    "none";

  try {

    const response =
      await fetch(
        "/api/admin-login",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            password
          })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Password non corretta"
      );
    }

    document
      .getElementById(
        "loginArea"
      )
      .style.display =
        "none";

    document
      .getElementById(
        "adminArea"
      )
      .style.display =
        "block";

    loadProducts();

  } catch (error) {

    message.textContent =
      error.message;

    message.style.display =
      "block";
  }
}


/* =========================
   CARICA PRODOTTI
========================= */

async function loadProducts() {

  const list =
    document
      .getElementById(
        "productsList"
      );

  list.innerHTML =
    "Caricamento...";

  try {

    const response =
      await fetch(
        "/api/products?cache=" +
        Date.now()
      );

    const data =
      await response.json();

    if (!response.ok) {
      throw new Error(
        data.error ||
        "Errore caricamento prodotti"
      );
    }

    const products =
      data.products || [];

    if (products.length === 0) {

      list.innerHTML =
        "<p>Nessun prodotto presente.</p>";

      return;
    }

    list.innerHTML = "";

    products.forEach(
      product => {

        const div =
          document.createElement(
            "div"
          );

        div.className =
          "product";


        if (product.image) {

          const img =
            document.createElement(
              "img"
            );

          img.src =
            product.image;

          img.alt =
            product.name;

          div.appendChild(img);
        }


        const name =
          document.createElement(
            "div"
          );

        name.className =
          "product-name";

        name.textContent =
          product.name;

        div.appendChild(name);


        const price =
          document.createElement(
            "div"
          );

        price.className =
          "product-info";

        price.textContent =
          "€" +
          Number(
            product.price
          ).toFixed(2);

        div.appendChild(price);


        const category =
          document.createElement(
            "div"
          );

        category.className =
          "product-info";

        category.textContent =
          product.category;

        div.appendChild(category);


        const button =
          document.createElement(
            "button"
          );

        button.className =
          "delete";

        button.textContent =
          "🗑 Elimina prodotto";

        button.onclick =
          () =>
            deleteProduct(
              product.id
            );

        div.appendChild(button);

        list.appendChild(div);
      }
    );

  } catch (error) {

    list.innerHTML =
      `<div
        class="message error"
        style="display:block"
      >
        ${error.message}
      </div>`;
  }
}


/* =========================
   RIDUCI FOTO
========================= */

function compressImage(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        function(event) {

          const image =
            new Image();

          image.onload =
            function() {

              const maxSize =
                1600;

              let width =
                image.width;

              let height =
                image.height;


              if (
                width > maxSize ||
                height > maxSize
              ) {

                if (
                  width > height
                ) {

                  height =
                    Math.round(
                      height *
                      maxSize /
                      width
                    );

                  width =
                    maxSize;

                } else {

                  width =
                    Math.round(
                      width *
                      maxSize /
                      height
                    );

                  height =
                    maxSize;
                }
              }


              const canvas =
                document.createElement(
                  "canvas"
                );

              canvas.width =
                width;

              canvas.height =
                height;


              const context =
                canvas.getContext(
                  "2d"
                );

              context.drawImage(
                image,
                0,
                0,
                width,
                height
              );


              canvas.toBlob(
                blob => {

                  if (!blob) {

                    reject(
                      new Error(
                        "Impossibile preparare la foto."
                      )
                    );

                    return;
                  }

                  resolve(blob);

                },
                "image/jpeg",
                0.82
              );
            };


          image.onerror =
            function() {

              reject(
                new Error(
                  "Impossibile leggere la foto."
                )
              );
            };


          image.src =
            event.target.result;
        };


      reader.onerror =
        function() {

          reject(
            new Error(
              "Impossibile leggere il file."
            )
          );
        };


      reader.readAsDataURL(file);
    }
  );
}


/* =========================
   BLOB IN BASE64
========================= */

function blobToBase64(blob) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        () => reject(
          new Error(
            "Errore lettura foto."
          )
        );

      reader.readAsDataURL(blob);
    }
  );
}


/* =========================
   AGGIUNGI PRODOTTO
========================= */

async function addProduct() {

  const button =
    document
      .getElementById(
        "publishButton"
      );

  const message =
    document
      .getElementById(
        "addMessage"
      );

  const name =
    document
      .getElementById(
        "productName"
      )
      .value
      .trim();

  const price =
    document
      .getElementById(
        "productPrice"
      )
      .value;

  const category =
    document
      .getElementById(
        "productCategory"
      )
      .value;

  const file =
    document
      .getElementById(
        "productImage"
      )
      .files[0];


  message.style.display =
    "none";


  if (!name) {

    showMessage(
      message,
      "Inserisci il nome del prodotto.",
      true
    );

    return;
  }


  if (
    !price ||
    Number(price) <= 0
  ) {

    showMessage(
      message,
      "Inserisci un prezzo valido.",
      true
    );

    return;
  }


  if (!file) {

    showMessage(
      message,
      "Seleziona una foto del prodotto.",
      true
    );

    return;
  }


  button.disabled =
    true;

  button.textContent =
    "Preparazione foto...";


  try {

    /*
      Riduciamo la foto
      direttamente sull'iPhone.
    */

    const compressed =
      await compressImage(
        file
      );


    const base64 =
      await blobToBase64(
        compressed
      );


    button.textContent =
      "Caricamento foto...";


    /*
      Invia la foto al nostro
      endpoint server.
    */

    const uploadResponse =
      await fetch(
        "/api/upload",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            filename:
              file.name,

            contentType:
              "image/jpeg",

            data:
              base64

          })
        }
      );


    const uploadData =
      await uploadResponse.json();


    if (!uploadResponse.ok) {

      throw new Error(
        uploadData.error ||
        "Impossibile caricare la foto."
      );
    }


    if (!uploadData.url) {

      throw new Error(
        "Vercel non ha restituito la foto."
      );
    }


    button.textContent =
      "Salvataggio prodotto...";


    /*
      Salva il prodotto nel catalogo.
    */

    const response =
      await fetch(
        "/api/products",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({

            name:

              name,

            price:

              Number(price),

            category:

              category,

            image:

              uploadData.url

          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Impossibile salvare il prodotto."
      );
    }


    showMessage(
      message,
      "✅ Prodotto aggiunto correttamente!",
      false
    );


    document
      .getElementById(
        "productName"
      )
      .value = "";


    document
      .getElementById(
        "productPrice"
      )
      .value = "35";


    document
      .getElementById(
        "productImage"
      )
      .value = "";


    await loadProducts();


  } catch (error) {

    showMessage(
      message,
      "❌ " +
      error.message,
      true
    );

  } finally {

    button.disabled =
      false;

    button.textContent =
      "Pubblica prodotto";
  }
}


/* =========================
   ELIMINA PRODOTTO
========================= */

async function deleteProduct(
  id
) {

  const conferma =
    confirm(
      "Vuoi davvero eliminare questo prodotto?"
    );

  if (!conferma) {
    return;
  }


  try {

    const response =
      await fetch(
        "/api/products",
        {
          method: "DELETE",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            id
          })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "Impossibile eliminare il prodotto."
      );
    }


    await loadProducts();

  } catch (error) {

    alert(
      "Errore: " +
      error.message
    );
  }
}


/* =========================
   LOGOUT
========================= */

function logout() {
  location.reload();
}


/* =========================
   MESSAGGI
========================= */

function showMessage(
  element,
  text,
  isError
) {

  element.textContent =
    text;

  element.className =
    "message " +
    (
      isError
        ? "error"
        : "success"
    );

  element.style.display =
    "block";
}


/* =========================
   INVIO PASSWORD CON INVIO
========================= */

document
  .getElementById(
    "loginPassword"
  )
  .addEventListener(
    "keydown",
    function(event) {

      if (
        event.key === "Enter"
      ) {
        login();
      }

    }
  );

</script>

</body>
</html>
