<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>IL LAB — Luko Lab Custom</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #101010;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .back {
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      display: inline-block;
      margin-bottom: 60px;
    }

    h1 {
      font-size: 58px;
      margin: 0 0 10px;
    }

    .subtitle {
      color: #aaa;
      font-size: 22px;
      margin-bottom: 50px;
    }

    .box {
      background: #1d1d1d;
      border-radius: 28px;
      padding: 38px;
      margin-bottom: 30px;
    }

    h2 {
      font-size: 32px;
      margin-top: 0;
    }

    label {
      display: block;
      font-size: 18px;
      font-weight: bold;
      margin: 22px 0 10px;
    }

    input,
    select {
      width: 100%;
      padding: 18px;
      border-radius: 15px;
      border: 1px solid #555;
      background: #111;
      color: white;
      font-size: 18px;
    }

    button {
      width: 100%;
      padding: 19px;
      margin-top: 25px;
      border: 0;
      border-radius: 15px;
      background: white;
      color: #111;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 20px;
      padding: 15px;
      border-radius: 12px;
      background: #292929;
      color: #ddd;
      display: none;
    }

    .product {
      border-top: 1px solid #444;
      padding: 20px 0;
    }

    .product:first-child {
      border-top: 0;
    }

    .product-name {
      font-size: 20px;
      font-weight: bold;
    }

    .product-info {
      color: #aaa;
      margin-top: 7px;
    }

    .preview {
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      margin-top: 15px;
      border-radius: 15px;
      display: none;
      background: #111;
    }
  </style>
</head>

<body>

  <main class="wrap">

    <a class="back" href="/">← Torna allo shop</a>

    <h1>IL LAB</h1>

    <div class="subtitle">
      Area privata Luko Lab Custom
    </div>


    <!-- LOGIN -->

    <section id="loginBox" class="box">

      <h2>Accesso</h2>

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        placeholder="Inserisci la password"
        autocomplete="current-password"
      >

      <button id="loginButton">
        ENTRA NEL LAB
      </button>

      <div id="loginMessage" class="message"></div>

    </section>


    <!-- LAB -->

    <section id="labBox" class="hidden">

      <div class="box">

        <h2>Aggiungi prodotto</h2>

        <label for="name">
          Nome prodotto
        </label>

        <input
          id="name"
          type="text"
          placeholder="Es. Cappello Jungle"
        >

        <label for="price">
          Prezzo €
        </label>

        <input
          id="price"
          type="number"
          value="35"
          min="0.01"
          step="0.01"
        >

        <label for="category">
          Categoria
        </label>

        <select id="category">
          <option value="Cappelli">
            Cappelli
          </option>

          <option value="Abbigliamento">
            Abbigliamento
          </option>
        </select>

        <label for="photo">
          Foto
        </label>

        <input
          id="photo"
          type="file"
          accept="image/jpeg,image/png,image/webp,image/heic"
        >

        <img
          id="preview"
          class="preview"
          alt="Anteprima"
        >

        <button id="publishButton">
          PUBBLICA PRODOTTO
        </button>

        <div id="publishMessage" class="message"></div>

      </div>


      <div class="box">

        <h2>Prodotti</h2>

        <div id="productsList">
          Caricamento...
        </div>

      </div>

    </section>

  </main>


  <script>

    const loginBox =
      document.getElementById("loginBox");

    const labBox =
      document.getElementById("labBox");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const loginMessage =
      document.getElementById("loginMessage");

    const publishButton =
      document.getElementById("publishButton");

    const publishMessage =
      document.getElementById("publishMessage");

    const photoInput =
      document.getElementById("photo");

    const preview =
      document.getElementById("preview");


    function showMessage(element, text) {

      element.textContent = text;
      element.style.display = "block";

    }


    loginButton.addEventListener(
      "click",
      async function () {

        const password =
          passwordInput.value.trim();

        if (!password) {

          showMessage(
            loginMessage,
            "Inserisci la password."
          );

          return;
        }

        loginButton.disabled = true;

        loginButton.textContent =
          "ACCESSO...";

        loginMessage.style.display =
          "none";

        try {

          const response =
            await fetch(
              "/api/admin-login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({
                    password
                  })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Password non corretta"
            );

          }


          loginBox.classList.add(
            "hidden"
          );

          labBox.classList.remove(
            "hidden"
          );

          await loadProducts();


        } catch (error) {

          showMessage(
            loginMessage,
            error.message
          );

          loginButton.disabled =
            false;

          loginButton.textContent =
            "ENTRA NEL LAB";
        }

      }
    );


    passwordInput.addEventListener(
      "keydown",
      function (event) {

        if (event.key === "Enter") {

          loginButton.click();

        }

      }
    );


    photoInput.addEventListener(
      "change",
      function () {

        const file =
          photoInput.files[0];

        if (!file) {

          preview.style.display =
            "none";

          return;
        }

        const url =
          URL.createObjectURL(file);

        preview.src = url;

        preview.style.display =
          "block";

      }
    );


    async function loadProducts() {

      const list =
        document.getElementById(
          "productsList"
        );

      try {

        const response =
          await fetch(
            "/api/products"
          );

        const data =
          await response.json();

        const products =
          Array.isArray(data.products)
            ? data.products
            : [];


        if (products.length === 0) {

          list.textContent =
            "Nessun prodotto.";

          return;
        }


        list.innerHTML =
          products
            .map(function (product) {

              return `
                <div class="product">

                  <div class="product-name">
                    ${escapeHtml(product.name)}
                  </div>

                  <div class="product-info">
                    €${Number(product.price).toFixed(2)}
                    ·
                    ${escapeHtml(product.category)}
                  </div>

                </div>
              `;

            })
            .join("");

      } catch (error) {

        list.textContent =
          "Impossibile caricare i prodotti.";

      }

    }


    publishButton.addEventListener(
      "click",
      async function () {

        const name =
          document.getElementById(
            "name"
          ).value.trim();

        const price =
          document.getElementById(
            "price"
          ).value;

        const category =
          document.getElementById(
            "category"
          ).value;

        const file =
          photoInput.files[0];


        if (!name) {

          showMessage(
            publishMessage,
            "Inserisci il nome del prodotto."
          );

          return;
        }


        if (!file) {

          showMessage(
            publishMessage,
            "Seleziona una foto."
          );

          return;
        }


        publishButton.disabled =
          true;

        publishButton.textContent =
          "CARICAMENTO...";

        publishMessage.style.display =
          "none";


        try {

          const { upload } =
            await import(
              "https://cdn.jsdelivr.net/npm/@vercel/blob@2.4.0/+esm"
            );


          const blob =
            await upload(
              file.name,
              file,
              {
                access: "public",

                handleUploadUrl:
                  "/api/upload"
              }
            );


          const response =
            await fetch(
              "/api/products",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body:
                  JSON.stringify({

                    name,

                    price,

                    category,

                    image:
                      blob.url

                  })
              }
            );


          const data =
            await response.json();


          if (!response.ok) {

            throw new Error(
              data.error ||
              "Errore pubblicazione"
            );

          }


          showMessage(
            publishMessage,
            "Prodotto pubblicato!"
          );


          document.getElementById(
            "name"
          ).value = "";


          photoInput.value = "";

          preview.style.display =
            "none";


          await loadProducts();


        } catch (error) {

          showMessage(
            publishMessage,
            error.message ||
            "Errore durante il caricamento."
          );

        }


        publishButton.disabled =
          false;

        publishButton.textContent =
          "PUBBLICA PRODOTTO";

      }
    );


    function escapeHtml(value) {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }

  </script>

</body>
</html>
