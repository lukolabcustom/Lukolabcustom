<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luko Lab — Il Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .wrap {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    h2 {
      margin-top: 0;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .box {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #111;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff7777;
      margin-top: 12px;
    }

    .success {
      color: #79e6a3;
      margin-top: 12px;
    }

    .preview {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 18px;
      display: none;
    }

    .back {
      display: inline-block;
      color: white;
      margin-bottom: 25px;
      text-decoration: none;
    }

    .product {
      border-top: 1px solid #333;
      padding: 15px 0;
    }

    .product:first-child {
      border-top: 0;
    }

    .product img {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .muted {
      color: #999;
    }
  </style>
</head>

<body>

<div class="wrap">

  <a class="back" href="/">← Torna allo shop</a>

  <h1>IL LAB</h1>

  <div class="subtitle">
    Area privata Luko Lab Custom
  </div>

  <div id="loginBox" class="box">

    <h2>Accesso</h2>

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Inserisci la password"
      autocomplete="current-password"
    >

    <button id="loginButton" type="button">
      ENTRA NEL LAB
    </button>

    <div id="loginMessage"></div>

  </div>


  <div id="adminBox" class="hidden">

    <div class="box">

      <h2>Nuovo prodotto</h2>

      <label>Nome prodotto</label>

      <input
        id="productName"
        type="text"
        placeholder="Es. Cappello Tropical"
      >

      <label>Prezzo (€)</label>

      <input
        id="productPrice"
        type="number"
        step="0.01"
        min="0"
        placeholder="35"
      >

      <label>Categoria</label>

      <select id="productCategory">
        <option value="Cappelli">Cappelli</option>
        <option value="Abbigliamento">Abbigliamento</option>
      </select>

      <label>Foto</label>

      <input
        id="productImage"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/heic"
      >

      <img
        id="preview"
        class="preview"
        alt="Anteprima prodotto"
      >

      <button id="publishButton" type="button">
        PUBBLICA PRODOTTO
      </button>

      <div id="publishMessage"></div>

    </div>


    <div class="box">

      <h2>Prodotti pubblicati</h2>

      <div id="productsList">
        <span class="muted">Caricamento...</span>
      </div>

    </div>

  </div>

</div>


<script type="module">

  import { upload } from "https://cdn.jsdelivr.net/npm/@vercel/blob@2.4.0/+esm";


  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const loginMessage =
    document.getElementById("loginMessage");

  const loginBox =
    document.getElementById("loginBox");

  const adminBox =
    document.getElementById("adminBox");

  const productImage =
    document.getElementById("productImage");

  const preview =
    document.getElementById("preview");

  const publishButton =
    document.getElementById("publishButton");

  const publishMessage =
    document.getElementById("publishMessage");


  productImage.addEventListener("change", () => {

    const file = productImage.files[0];

    if (!file) {
      preview.style.display = "none";
      return;
    }

    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";

  });


  loginButton.addEventListener("click", login);


  async function login() {

    const password =
      passwordInput.value.trim();

    loginMessage.className = "";
    loginMessage.textContent = "";

    if (!password) {

      loginMessage.className = "error";
      loginMessage.textContent =
        "Inserisci la password.";

      return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "ACCESSO...";

    try {

      const response = await fetch(
        "/api/admin-login",
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            password
          })
        }
      );

      const data =
        await response.json().catch(() => ({}));

      if (!response.ok) {
        throw new Error(
          data.error || "Accesso non riuscito"
        );
      }

      loginBox.classList.add("hidden");
      adminBox.classList.remove("hidden");

      await loadProducts();

    } catch (error) {

      loginMessage.className = "error";
      loginMessage.textContent =
        error.message;

      loginButton.disabled = false;
      loginButton.textContent =
        "ENTRA NEL LAB";
    }
  }


  publishButton.addEventListener(
    "click",
    publishProduct
  );


  async function publishProduct() {

    const name =
      document.getElementById("productName")
        .value.trim();

    const price =
      Number(
        document.getElementById("productPrice")
          .value
      );

    const category =
      document.getElementById("productCategory")
        .value;

    const file =
      productImage.files[0];


    publishMessage.className = "";
    publishMessage.textContent = "";


    if (!name) {

      publishMessage.className = "error";
      publishMessage.textContent =
        "Inserisci il nome del prodotto.";

      return;
    }


    if (!price || price <= 0) {

      publishMessage.className = "error";
      publishMessage.textContent =
        "Inserisci un prezzo valido.";

      return;
    }


    if (!file) {

      publishMessage.className = "error";
      publishMessage.textContent =
        "Seleziona una foto.";

      return;
    }


    publishButton.disabled = true;
    publishButton.textContent =
      "CARICAMENTO FOTO...";


    try {

      const blob =
        await upload(
          `prodotti/${Date.now()}-${file.name}`,
          file,
          {
            access: "public",
            handleUploadUrl: "/api/upload"
          }
        );


      publishMessage.className = "success";
      publishMessage.textContent =
        "Foto caricata. Salvataggio prodotto...";


      const response =
        await fetch("/api/products", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name,
            price,
            category,
            image: blob.url
          })
        });


      const data =
        await response.json().catch(() => ({}));


      if (!response.ok) {
        throw new Error(
          data.error ||
          "Impossibile salvare il prodotto."
        );
      }


      publishMessage.textContent =
        "Prodotto pubblicato!";


      document.getElementById("productName")
        .value = "";

      document.getElementById("productPrice")
        .value = "";

      productImage.value = "";

      preview.src = "";
      preview.style.display = "none";


      await loadProducts();


    } catch (error) {

      console.error(error);

      publishMessage.className = "error";
      publishMessage.textContent =
        error.message ||
        "Errore durante la pubblicazione.";

    }


    publishButton.disabled = false;
    publishButton.textContent =
      "PUBBLICA PRODOTTO";
  }


  async function loadProducts() {

    const list =
      document.getElementById("productsList");

    try {

      const response =
        await fetch("/api/products");

      const data =
        await response.json();

      if (
        !response.ok ||
        !Array.isArray(data.products)
      ) {
        throw new Error();
      }


      if (data.products.length === 0) {

        list.innerHTML =
          "<span class='muted'>Nessun prodotto.</span>";

        return;
      }


      list.innerHTML =
        data.products.map(product => `

          <div class="product">

            ${
              product.image
              ? `<img src="${product.image}" alt="">`
              : ""
            }

            <strong>
              ${escapeHtml(product.name)}
            </strong>

            <div class="muted">
              €${Number(product.price).toFixed(2)}
              · ${escapeHtml(product.category)}
            </div>

          </div>

        `).join("");

    } catch (error) {

      list.innerHTML =
        "<span class='muted'>Catalogo non ancora disponibile.</span>";
    }
  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

</script>

</body>
</html>
