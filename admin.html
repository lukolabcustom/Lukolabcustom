<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luko Lab — Il Lab</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
    }

    .wrap {
      max-width: 600px;
      margin: auto;
      padding: 30px 20px 60px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .box {
      background: #1c1c1c;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #111;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: white;
      color: #111;
      font-weight: bold;
      font-size: 15px;
    }

    .hidden {
      display: none;
    }

    .error {
      color: #ff7777;
      margin-top: 12px;
    }

    .success {
      color: #79e6a3;
      margin-top: 12px;
    }

    .back {
      display: inline-block;
      color: white;
      margin-bottom: 25px;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="wrap">

  <a class="back" href="/">← Torna allo shop</a>

  <h1>IL LAB</h1>
  <div class="subtitle">
    Area privata Luko Lab Custom
  </div>

  <div id="loginBox" class="box">

    <h2>Accesso</h2>

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Inserisci la password"
      autocomplete="current-password"
    >

    <button onclick="login()">
      ENTRA NEL LAB
    </button>

    <div id="loginMessage"></div>

  </div>

  <div id="adminBox" class="hidden">

    <div class="box">

      <h2>Nuovo prodotto</h2>

      <label>Nome prodotto</label>

      <input
        id="productName"
        type="text"
        placeholder="Es. Cappello Tropical"
      >

      <label>Prezzo (€)</label>

      <input
        id="productPrice"
        type="number"
        step="0.01"
        min="0"
        placeholder="35"
      >

      <label>Categoria</label>

      <select id="productCategory">
        <option value="Cappelli">Cappelli</option>
        <option value="Abbigliamento">Abbigliamento</option>
      </select>

      <label>Foto</label>

      <input
        id="productImage"
        type="file"
        accept="image/*"
      >

      <button onclick="publishProduct()">
        PUBBLICA PRODOTTO
      </button>

      <div id="publishMessage"></div>

    </div>

    <div class="box">

      <h2>Prodotti pubblicati</h2>

      <div id="productsList">
        Caricamento...
      </div>

    </div>

  </div>

</div>

<script>

async function login() {

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.className = "";
  message.textContent = "";

  if (!password) {
    message.className = "error";
    message.textContent = "Inserisci la password.";
    return;
  }

  try {

    const response = await fetch("/api/admin-login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "Accesso non riuscito"
      );
    }

    document.getElementById("loginBox")
      .classList.add("hidden");

    document.getElementById("adminBox")
      .classList.remove("hidden");

    loadProducts();

  } catch (error) {

    message.className = "error";
    message.textContent = error.message;

  }
}


async function publishProduct() {

  const name =
    document.getElementById("productName").value.trim();

  const price =
    document.getElementById("productPrice").value;

  const category =
    document.getElementById("productCategory").value;

  const image =
    document.getElementById("productImage").files[0];

  const message =
    document.getElementById("publishMessage");

  message.className = "";
  message.textContent = "";

  if (!name || !price || !image) {

    message.className = "error";
    message.textContent =
      "Inserisci nome, prezzo e foto.";

    return;
  }

  message.className = "success";
  message.textContent =
    "Preparazione del prodotto...";

  /*
    Il caricamento effettivo della foto e
    la pubblicazione nel catalogo verranno
    collegati nel prossimo passaggio.
  */

  setTimeout(() => {

    message.textContent =
      "Area pronta. Ora colleghiamo il caricamento foto.";

  }, 500);
}


async function loadProducts() {

  document.getElementById("productsList").innerHTML =
    "<p style='color:#aaa'>Catalogo in preparazione...</p>";

}

</script>

</body>
</html>
