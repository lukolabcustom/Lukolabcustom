<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luko Lab Custom</title>
<style>
*{
  box-sizing:border-box;
}
html{
  scroll-behavior:smooth;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#071b12;
  color:#fff;
}
header{
  min-height:430px;
  padding:70px 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 20% 20%,rgba(50,180,90,.35),transparent 30%),
    radial-gradient(circle at 80% 30%,rgba(0,130,80,.35),transparent 30%),
    linear-gradient(135deg,#092b19,#03150d);
  position:relative;
  overflow:hidden;
}
header:before,
header:after{
  content:"";
  position:absolute;
  border-radius:50%;
  opacity:.15;
}
header:before{
  width:500px;
  height:500px;
  background:#3aff86;
  left:-220px;
  top:-250px;
}
header:after{
  width:600px;
  height:600px;
  background:#0a8f58;
  right:-300px;
  bottom:-350px;
}
.hero{
  position:relative;
  z-index:2;
  max-width:850px;
}
.logo{
  font-size:clamp(42px,9vw,90px);
  font-weight:900;
  letter-spacing:-4px;
  margin:0;
}
.subtitle{
  margin:18px 0 0;
  font-size:clamp(16px,3vw,23px);
  color:#b8d9c5;
}
.hero-text{
  margin:30px auto 0;
  max-width:650px;
  color:#dcebe2;
  line-height:1.6;
}
nav{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(3,20,13,.94);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.1);
}
.nav-inner{
  max-width:1200px;
  margin:auto;
  min-height:70px;
  padding:12px 20px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.filters{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}
.filters button{
  border:1px solid rgba(255,255,255,.2);
  background:#102d1e;
  color:#fff;
  border-radius:999px;
  padding:12px 20px;
  font-weight:700;
  cursor:pointer;
}
.filters button.active,
.filters button:hover{
  background:#35d978;
  color:#062012;
}
main{
  max-width:1200px;
  margin:auto;
  padding:70px 20px 120px;
}
.section-title{
  text-align:center;
  margin-bottom:40px;
}
.section-title h2{
  margin:0 0 10px;
  font-size:clamp(30px,6vw,52px);
}
.section-title p{
  margin:0;
  color:#a8c4b3;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:22px;
}
.card{
  background:#10291c;
  border:1px solid rgba(255,255,255,.1);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 18px 50px rgba(0,0,0,.25);
}
.photo{
  height:280px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:
    radial-gradient(circle at 30% 30%,rgba(55,220,120,.3),transparent 35%),
    linear-gradient(135deg,#173e27,#08170e);
  color:#8fb8a0;
  font-weight:800;
  letter-spacing:1px;
}
.card-body{
  padding:20px;
}
.card h3{
  margin:0 0 12px;
  font-size:19px;
}
.price{
  font-size:22px;
  font-weight:800;
  margin-bottom:18px;
}
.card button{
  width:100%;
  border:0;
  border-radius:13px;
  padding:14px;
  background:#35d978;
  color:#062012;
  font-weight:900;
  cursor:pointer;
}
.card button:hover{
  background:#55ee94;
}
.empty{
  grid-column:1/-1;
  padding:50px;
  text-align:center;
  color:#9bb7a7;
}
.cart-toggle{
  position:fixed;
  right:18px;
  bottom:18px;
  z-index:50;
  border:0;
  border-radius:999px;
  padding:16px 22px;
  background:#35d978;
  color:#062012;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 12px 35px rgba(0,0,0,.4);
}
.hidden{
  display:none!important;
}
.cart{
  position:fixed;
  right:18px;
  bottom:18px;
  width:min(420px,calc(100vw - 36px));
  max-height:80vh;
  overflow:auto;
  z-index:60;
  background:#10291c;
  border:1px solid rgba(255,255,255,.15);
  border-radius:24px;
  padding:22px;
  box-shadow:0 25px 70px rgba(0,0,0,.55);
}
.cart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}
.cart-head h2{
  margin:0;
}
.close{
  border:0;
  background:rgba(255,255,255,.1);
  color:#fff;
  width:38px;
  height:38px;
  border-radius:50%;
  cursor:pointer;
  font-size:20px;
}
.cart-item{
  padding:16px 0;
  border-bottom:1px solid rgba(255,255,255,.1);
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:center;
}
.cart-item strong{
  display:inline-block;
  margin-bottom:5px;
}
.qty{
  display:flex;
  align-items:center;
  gap:9px;
}
.qty button{
  width:32px;
  height:32px;
  border:0;
  border-radius:8px;
  background:#244d34;
  color:#fff;
  font-size:20px;
  cursor:pointer;
}
.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:900;
  padding:20px 0;
}
.checkout{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  background:#35d978;
  color:#062012;
  font-weight:900;
  font-size:16px;
  cursor:pointer;
}
.checkout:disabled{
  opacity:.6;
  cursor:wait;
}
.secure{
  text-align:center;
  margin-top:12px;
  font-size:12px;
  color:#8fae9b;
}
footer{
  padding:50px 20px;
  text-align:center;
  color:#759481;
  border-top:1px solid rgba(255,255,255,.08);
}
@media(max-width:600px){
  header{
    min-height:390px;
    padding:50px 18px;
  }
  main{
    padding-top:50px;
  }
  .products{
    grid-template-columns:1fr;
  }
  .photo{
    height:300px;
  }
}
</style>
</head>
<body>
<header>
  <div class="hero">
    <h1 class="logo">LUKO LAB</h1>
    <div class="subtitle">CUSTOM · HANDMADE · JUNGLE SPIRIT</div>
    <p class="hero-text">
      Benvenuto nella giungla di Luko Lab Custom.
      Esplora la collezione e porta con te un pezzo fatto a mano.
    </p>
  </div>
</header>
<nav>
  <div class="nav-inner">
    <div class="filters">
      <button class="active" data-filter="all">TUTTI</button>
      <button data-filter="Cappelli">CAPPELLI</button>
      <button data-filter="Abbigliamento">ABBIGLIAMENTO</button>
    </div>
  </div>
</nav>
<main>
  <div class="section-title">
    <h2>Esplora la collezione</h2>
    <p>Creazioni handmade Luko Lab Custom</p>
  </div>
  <section class="products" id="products"></section>
</main>

<button
class=“cart-toggle”
id=“cartToggle”
type=“button”
onclick=“toggleCart()”

CARRELLO (0)
<div class="cart hidden" id="cart">
  <div class="cart-head">
    <h2>Il tuo carrello</h2>
<button
  class="close"
  type="button"
  onclick="toggleCart()"
>
  ×
</button>
  </div>
  <div id="cartItems"></div>
  <div class="total">
    <span>Totale</span>
    <span>€<span id="total">0.00</span></span>
  </div>

<button
class=“checkout”
id=“checkoutBtn”
type=“button”
onclick=“checkout()”

PAGA CON CARTA
  </button>
  <div class="secure">
    Pagamento sicuro tramite Stripe
  </div>
</div>
<footer>
  © Luko Lab Custom
</footer>
<script>
/* =========================
   PRODOTTI
========================= */
const products = [];
for(let i = 1; i <= 14; i++){
  const number = String(i).padStart(2,"0");
  products.push({
    id: "cap-" + number,
    name: "Cappello Luko Lab " + number,
    price: 35,
    category: "Cappelli"
  });
}
/* =========================
   CARRELLO
========================= */
/*
  Carichiamo il vecchio carrello in modo sicuro.
  Se Safari ha dati vecchi o corrotti,
  il carrello viene automaticamente azzerato.
*/
let cart = [];
try{
  const savedCart =
    localStorage.getItem("lukoCart");
  if(savedCart){
    const parsed =
      JSON.parse(savedCart);
    if(Array.isArray(parsed)){
      cart = parsed.filter(item =>
        item &&
        typeof item.id === "string" &&
        Number(item.quantity) > 0
      );
    }
  }
}catch(error){
  console.log("Carrello precedente non valido.");
  cart = [];
}
/* =========================
   SALVATAGGIO
========================= */
function save(){
  try{
    localStorage.setItem(
      "lukoCart",
      JSON.stringify(cart)
    );
  }catch(error){
    console.log("Impossibile salvare il carrello.");
  }
}
/* =========================
   PRODOTTI
========================= */
function renderProducts(filter = "all"){
  const container =
    document.getElementById("products");
  let list = products;
  if(filter !== "all"){
    list = products.filter(
      product =>
        product.category === filter
    );
  }
  if(!list.length){
    container.innerHTML = `
      <div class="empty">
        Nessun prodotto disponibile in questa categoria.
      </div>
    `;
    return;
  }
  container.innerHTML =
    list.map(product => `
      <article class="card">
        <div class="photo">
          FOTO PRODOTTO
        </div>
        <div class="card-body">
          <h3>
            ${product.name}
          </h3>
          <div class="price">
            €${product.price.toFixed(2)}
          </div>
          <button
            type="button"
            onclick="addToCart('${product.id}')"
          >
            AGGIUNGI AL CARRELLO
          </button>
        </div>
      </article>
    `).join("");
}
/* =========================
   AGGIUNGI AL CARRELLO
========================= */
function addToCart(id){
  const product =
    products.find(
      product => product.id === id
    );
  if(!product){
    alert("Prodotto non trovato.");
    return;
  }
  let item =
    cart.find(
      item => item.id === id
    );
  if(item){
    item.quantity =
      Math.min(
        10,
        Number(item.quantity) + 1
      );
  }else{
    cart.push({
      id: id,
      quantity: 1
    });
  }
  /*
    Prima aggiorniamo la grafica,
    poi salviamo il carrello.
  */
  renderCart();
  save();
  /*
    Apriamo automaticamente il carrello.
  */
  openCart();
}
/* =========================
   QUANTITÀ
========================= */
function changeQuantity(id, amount){
  const item =
    cart.find(
      item => item.id === id
    );
  if(!item){
    return;
  }
  item.quantity =
    Number(item.quantity) + amount;
  if(item.quantity <= 0){
    cart =
      cart.filter(
        item => item.id !== id
      );
  }
  if(item.quantity > 10){
    item.quantity = 10;
  }
  renderCart();
  save();
}
/* =========================
   RENDER CARRELLO
========================= */
function renderCart(){
  const box =
    document.getElementById("cartItems");
  /*
    Rimuoviamo eventuali prodotti
    non più presenti nel catalogo.
  */
  cart =
    cart.filter(item =>
      products.some(
        product => product.id === item.id
      )
    );
  if(cart.length === 0){
    box.innerHTML = `
      <div style="
        color:#999;
        padding:20px 0;
      ">
        Il carrello è vuoto.
      </div>
    `;
  }else{
    box.innerHTML =
      cart.map(item => {
        const product =
          products.find(
            product =>
              product.id === item.id
          );
        return `
          <div class="cart-item">
            <div>
              <strong>
                ${product.name}
              </strong>
              <br>
              €${product.price.toFixed(2)}
              × ${item.quantity}
            </div>
            <div class="qty">
              <button
                type="button"
                onclick="changeQuantity('${product.id}',-1)"
              >
                −
              </button>
              <span>
                ${item.quantity}
              </span>
              <button
                type="button"
                onclick="changeQuantity('${product.id}',1)"
              >
                +
              </button>
            </div>
          </div>
        `;
      }).join("");
  }
  const total =
    cart.reduce(
      (sum,item) => {
        const product =
          products.find(
            product =>
              product.id === item.id
          );
        return sum +
          (product.price * item.quantity);
      },
      0
    );
  const count =
    cart.reduce(
      (sum,item) =>
        sum + Number(item.quantity),
      0
    );
  document.getElementById(
    "total"
  ).textContent =
    total.toFixed(2);
  document.getElementById(
    "cartCount"
  ).textContent =
    count;
}
/* =========================
   CARRELLO APERTO / CHIUSO
========================= */
function openCart(){
  document
    .getElementById("cart")
    .classList.remove("hidden");
  document
    .getElementById("cartToggle")
    .classList.add("hidden");
}
function closeCart(){
  document
    .getElementById("cart")
    .classList.add("hidden");
  document
    .getElementById("cartToggle")
    .classList.remove("hidden");
}
function toggleCart(){
  const cartBox =
    document.getElementById("cart");
  if(cartBox.classList.contains("hidden")){
    openCart();
  }else{
    closeCart();
  }
}
/* =========================
   CHECKOUT STRIPE
========================= */
async function checkout(){
  if(cart.length === 0){
    alert("Il carrello è vuoto.");
    return;
  }
  const button =
    document.getElementById("checkoutBtn");
  button.disabled = true;
  button.textContent =
    "APERTURA PAGAMENTO…";
  try{
    const response =
      await fetch(
        "/api/checkout",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              items: cart
            })
        }
      );
    const data =
      await response
        .json()
        .catch(() => ({}));
    if(
      !response.ok ||
      !data.url
    ){
      throw new Error(
        data.error ||
        "Errore nel pagamento"
      );
    }
    /*
      Stripe Checkout
    */
    window.location.href =
      data.url;
  }catch(error){
    console.error(error);
    alert(
      "Non è stato possibile aprire il pagamento. Riprova tra poco."
    );
    button.disabled = false;
    button.textContent =
      "PAGA CON CARTA";
  }
}
/* =========================
   FILTRI
========================= */
document
  .querySelectorAll(
    ".filters button"
  )
  .forEach(button => {
    button.addEventListener(
      "click",
      () => {
        document
          .querySelectorAll(
            ".filters button"
          )
          .forEach(btn =>
            btn.classList.remove("active")
          );
        button.classList.add("active");
        renderProducts(
          button.dataset.filter
        );
      }
    );
  });
/* =========================
   AVVIO
========================= */
renderProducts();
renderCart();
</script>
</body>
</html>
